<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1 id="id-titulo">To-Do App</h1>
    </header>

    <section class="new-task">
      <input id="task-input" type="text" placeholder="Escribe una tarea y presiona Enter" />
      <button id="create-btn">Crear</button>
    </section>

    <section class="tasks">
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>

  <script src="../script/app.js"></script>
</body>
</html>
